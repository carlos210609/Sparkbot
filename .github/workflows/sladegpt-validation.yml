name: SladeGPT Validation
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task being worked on by ChatGPT
        required: true
        type: string
      branch:
        description: SladeGPT branch to validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restrict validation to SladeGPT branches
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          case "$TARGET_BRANCH" in
            sladegpt/*) ;;
            *) echo "Refusing to validate branch outside sladegpt/*"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: TypeScript build
        run: npm run build
      - name: Create validation report
        if: always()
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          TARGET_BRANCH: ${{ inputs.branch }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "SladeGPT validation report"
            echo "Task: $TASK"
            echo "Branch: $TARGET_BRANCH"
            echo "Job outcome: $JOB_STATUS"
            echo "Commit: $(git rev-parse HEAD)"
          } > sladegpt-validation-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sladegpt-validation-report
          path: sladegpt-validation-report.txt
          if-no-files-found: warn
