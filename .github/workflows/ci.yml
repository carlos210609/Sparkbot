name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" "pydantic>=2.8,<3" "python-dotenv>=1.0,<2" "pytest>=8,<9" "httpx>=0.27,<1" "ruff>=0.6,<1"
      - run: ruff check .
      - run: pytest -q
